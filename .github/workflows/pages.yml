name: Deploy Rez Wiz to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'rez-wiz/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload rez-wiz as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: rez-wiz
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
