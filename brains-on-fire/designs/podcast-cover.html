<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brains on Fire — Podcast Cover</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
  }

  .cover {
    width: 1400px;
    height: 1400px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(160deg, #3d0c11 0%, #6b1a1a 30%, #8b2500 60%, #4a1040 100%);
  }

  .flame-layer {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 70%;
  }

  .flame {
    position: absolute;
    bottom: 0;
    border-radius: 50% 50% 20% 20%;
    opacity: 0.85;
    animation: flicker 2.5s ease-in-out infinite alternate;
  }

  @keyframes flicker {
    0% { transform: scaleY(1) scaleX(1); opacity: 0.85; }
    100% { transform: scaleY(1.08) scaleX(0.97); opacity: 1; }
  }

  .flame-1 { left: 5%; width: 160px; height: 520px; background: linear-gradient(to top, #ff6b00, #ffd700, transparent); animation-delay: 0s; }
  .flame-2 { left: 12%; width: 120px; height: 380px; background: linear-gradient(to top, #c0392b, #e74c3c, transparent); animation-delay: 0.3s; }
  .flame-3 { left: 20%; width: 200px; height: 600px; background: linear-gradient(to top, #ff4500, #ff8c00, #ffd700, transparent); animation-delay: 0.6s; }
  .flame-4 { left: 35%; width: 140px; height: 460px; background: linear-gradient(to top, #8b0000, #dc143c, transparent); animation-delay: 0.1s; }
  .flame-5 { left: 48%; width: 180px; height: 550px; background: linear-gradient(to top, #ff4500, #ff7f00, transparent); animation-delay: 0.8s; }
  .flame-6 { left: 60%; width: 160px; height: 480px; background: linear-gradient(to top, #b22222, #ff6347, transparent); animation-delay: 0.4s; }
  .flame-7 { left: 72%; width: 220px; height: 620px; background: linear-gradient(to top, #ff4500, #ffa500, #ffd700, transparent); animation-delay: 0.2s; }
  .flame-8 { right: 5%; width: 150px; height: 440px; background: linear-gradient(to top, #8b0000, #ff6347, transparent); animation-delay: 0.7s; }

  .silhouettes {
    position: absolute;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 20px;
    align-items: flex-end;
  }

  .silhouette {
    border-radius: 50% 50% 0 0;
    position: relative;
  }

  .sil-1 { width: 140px; height: 320px; background: linear-gradient(to top, #1a0a2e, #2d1b4e); }
  .sil-2 { width: 120px; height: 290px; background: linear-gradient(to top, #1a1a2e, #16213e); }
  .sil-3 { width: 130px; height: 340px; background: linear-gradient(to top, #0d2137, #1e3a5f); }
  .sil-4 { width: 110px; height: 270px; background: linear-gradient(to top, #1a0a0a, #3d1515); }
  .sil-5 { width: 145px; height: 310px; background: linear-gradient(to top, #1a1a0a, #2d2d0a); }

  .head { position: absolute; top: -55px; left: 50%; transform: translateX(-50%); border-radius: 50%; }
  .sil-1 .head { width: 75px; height: 80px; background: #2d1b4e; }
  .sil-2 .head { width: 65px; height: 70px; background: #16213e; }
  .sil-3 .head { width: 70px; height: 78px; background: #1e3a5f; }
  .sil-4 .head { width: 60px; height: 68px; background: #3d1515; }
  .sil-5 .head { width: 78px; height: 82px; background: #2d2d0a; }

  .hair-1 { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); width: 90px; height: 60px; background: #1a0a2e; border-radius: 50% 50% 0 0; }
  .hair-afro { position: absolute; top: -50px; left: 50%; transform: translateX(-50%); width: 100px; height: 70px; background: #1a1a0a; border-radius: 50%; }

  .text-block {
    position: absolute;
    top: 80px;
    left: 0;
    width: 100%;
    text-align: center;
    padding: 0 60px;
  }

  .subtitle-top {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 48px;
    color: #d4a853;
    letter-spacing: 1px;
    margin-bottom: 12px;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
  }

  .main-title {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 130px;
    line-height: 1;
    color: #ffffff;
    text-shadow: 3px 3px 12px rgba(0,0,0,0.7), 0 0 40px rgba(255,100,0,0.3);
    letter-spacing: -2px;
  }

  .tagline {
    position: absolute;
    bottom: 60px;
    left: 0;
    width: 100%;
    text-align: center;
    font-family: 'Inter', sans-serif;
    font-size: 32px;
    font-weight: 600;
    color: rgba(255,255,255,0.75);
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  .gem-bar {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 12px;
    background: linear-gradient(90deg, #8b0000, #d4a853, #1a5276, #8b0000);
  }
</style>
</head>
<body>
<div class="cover">
  <div class="gem-bar"></div>

  <div class="text-block">
    <div class="subtitle-top">Misdiagnosed, Overheated &amp; Overlooked</div>
    <div class="main-title">Brains<br>on Fire</div>
  </div>

  <div class="flame-layer">
    <div class="flame flame-1"></div>
    <div class="flame flame-2"></div>
    <div class="flame flame-3"></div>
    <div class="flame flame-4"></div>
    <div class="flame flame-5"></div>
    <div class="flame flame-6"></div>
    <div class="flame flame-7"></div>
    <div class="flame flame-8"></div>
  </div>

  <div class="silhouettes">
    <div class="silhouette sil-1"><div class="head"><div class="hair-1"></div></div></div>
    <div class="silhouette sil-2"><div class="head"></div></div>
    <div class="silhouette sil-3"><div class="head"><div class="hair-afro"></div></div></div>
    <div class="silhouette sil-4"><div class="head"></div></div>
    <div class="silhouette sil-5"><div class="head"><div class="hair-1"></div></div></div>
  </div>

  <div class="tagline">A podcast for Gen X women with late-diagnosed ADHD &amp; perimenopause</div>
</div>
</body>
</html>
